 <script>


 const sections = document.querySelectorAll(".section");

 window.addEventListener("scroll", () => {
    sections.forEach(sec => {
        const position = sec.getBoundingClientRect().top;
        const screen = window.innerHeight / 1.3;

        if(position < screen){
            sec.classList.add("active");
        }
    });
 });
 </script>


 <div class="cart" id="cart">
    <div class="cart-header">
        <h2>Votre panier</h2>
        <span class="close-cart" onclick="toggleCart()">✖</span>
    </div>

    <ul id="cart-items"></ul>
    <h3>Total : <span id="cart-total">0</span> FCFA</h3>
    <button onclick="clearCart()" class="btn">Vider</button>
    <button onclick="orderWhatsApp()" class="btn">
        Commander via WhatsApp
    </button>
 </div>


 <script>

 let cart = [];

 function addToCart(name, price, image, code){

    let existing = cart.find(item => item.code === code);

    if(existing){
        existing.quantity++;
    } else {
        cart.push({name, price, image, code, quantity:1});
    }

    updateCart();
 }

function updateCart(){

    const cartItems = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const menuNotification = document.getElementById("menu-notification");
    const cartNotification = document.getElementById("cart-notification");

    cartItems.innerHTML = "";

    let total = 0;
    let totalQuantity = 0;

    cart.forEach((item, index) => {

        total += item.price * item.quantity;
        totalQuantity += item.quantity;

        let li = document.createElement("li");
        li.innerHTML = `
            <img src="${item.image}" width="50" style="vertical-align:middle;border-radius:5px;">
            <strong>${item.name}</strong> (${item.code})
            ${item.price} FCFA x ${item.quantity}
            <button onclick="increase(${index})">+</button>
            <button onclick="decrease(${index})">-</button>
            <button onclick="removeItem(${index})">❌</button>
            <br><br>
        `;
        cartItems.appendChild(li);
    });

    cartTotal.textContent = total;

    if(totalQuantity > 0){

        if(menuNotification){
            menuNotification.style.display = "flex";
            menuNotification.textContent = totalQuantity;
        }

        if(cartNotification){
            cartNotification.style.display = "flex";
            cartNotification.textContent = totalQuantity;
        }

    } else {

        if(menuNotification){
            menuNotification.style.display = "none";
        }

        if(cartNotification){
            cartNotification.style.display = "none";
        }
    }
}

 function increase(index){
    cart[index].quantity++;
    updateCart();
 }

 function decrease(index){
    if(cart[index].quantity > 1){
        cart[index].quantity--;
    } else {
        cart.splice(index,1);
    }
    updateCart();
 }

 function removeItem(index){
    cart.splice(index,1);
    updateCart();
 }


 function toggleCart(){
    const cartBox = document.getElementById("cart");
    cartBox.classList.toggle("active");

    if(cartBox.classList.contains("active")){
        document.body.style.overflow = "hidden";
    } else {
        document.body.style.overflow = "auto";
    }
 }



 function clearCart(){
    cart = [];
    updateCart();
 }

 function orderWhatsApp(){

    if(cart.length === 0){
        alert("Votre panier est vide !");
        return;
    }

    let total = 0;

    let message = "Bonjour AKOUNGA Shop,%0A%0A";
    message += "Je souhaite commander les produits suivants :%0A%0A";

    cart.forEach(item => {

        total += item.price * item.quantity;

        message += "Produit : " + item.name + "%0A";
        message += "Code : " + item.code + "%0A";
        message += "Quantité : " + item.quantity + "%0A";
        message += "Prix total : " + (item.price * item.quantity) + " FCFA%0A";
        message += "Image : https://tonsite.com/" + item.image + "%0A%0A";
    });

    message += "TOTAL GENERAL : " + total + " FCFA";

    let phone = "24166595089";

    window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
 }

 </script>

 <script>

 const searchInput = document.getElementById("search-input");
 const produits = document.querySelectorAll(".produit");

 searchInput.addEventListener("input", function() {

    let value = searchInput.value.toLowerCase();

    produits.forEach(produit => {

        let title = produit.querySelector("h3").textContent.toLowerCase();

        if(title.includes(value)){
            produit.style.display = "block";
        } else {
            produit.style.display = "none";
        }

    });

 });

</script>
</body>
