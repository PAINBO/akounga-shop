<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chaussures AKOUNGA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="indexx.css">
<style>
.gallery-container{
    max-width:900px;
    margin:50px auto;
    text-align:center;
}

.main-image{
    width:100%;
    max-width:400px;
    border-radius:15px;
    margin-bottom:20px;
    transition:0.3s;
}

.thumbnails{
    display:flex;
    justify-content:center;
    gap:15px;
}

.thumbnails img{
    width:80px;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
}

.thumbnails img:hover{
    transform:scale(1.1);
}


@media (max-width: 768px){

    .gallery-container{
        padding: 0 15px;
    }

    .main-image{
        width:100%;
        max-width:100%;
    }

    .thumbnails{
        flex-wrap: wrap;
        gap:10px;
    }

    .thumbnails img{
        width:70px;
    }

    h2{
        font-size:20px;
    }

}
</style>
</head>

<body>

<div class="gallery-container">

    <h2>Chaussures disponibles</h2>

    <img id="mainImage" src="image/chaussA1.jpg" class="main-image">

    <div class="thumbnails">
        <img src="image/chaussA1.jpg" onclick="changeImage(this)">
        <img src="image/chaussA2.jpg" onclick="changeImage(this)">
        <img src="image/chassA3.jpg" onclick="changeImage(this)">
    </div>

</div>

<script>
function changeImage(element){
    document.getElementById("mainImage").src = element.src;
}
</script>

</body>
</html>
